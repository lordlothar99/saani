<!-- Saani's map: the issues of a project as a desert war-game board seen from above. One source: served by `saani ui` at /map (live /api/state)
     and published as a private artifact (falls back to mock-state.json beside it; the top menu is the same there, the page switch, project selector and refresh inert). Original desert world: no names, logos, typefaces,
     characters or vehicle designs from any film or book. -->
<style>
#veil.open:not(.settled){animation:veilIn .22s ease-out both}
#veil.open:not(.settled) .panel{animation:panelIn .34s cubic-bezier(.2,.85,.25,1) both}
#veil.open:not(.settled) .panel .sec{animation:secIn .4s ease-out both;animation-delay:.12s}
#veil.open:not(.settled) .panel .sec:nth-child(2){animation-delay:.17s}
#veil.open:not(.settled) .panel .sec:nth-child(3){animation-delay:.22s}
#veil.open:not(.settled) .panel .sec:nth-child(4){animation-delay:.27s}
#veil.closing{animation:veilOut .3s ease-in both}
#veil.closing .panel{animation:panelOut .32s cubic-bezier(.55,0,.7,.4) both}
#veil.closing .panel .sec{animation:secOut .14s ease-in both}
@keyframes veilIn{from{background-color:rgba(10,6,3,0)}to{background-color:rgba(10,6,3,.62)}}
@keyframes veilOut{from{background-color:rgba(10,6,3,.62)}to{background-color:rgba(10,6,3,0)}}
@keyframes panelIn{from{opacity:0;transform:scale(.3)}60%{opacity:1}to{opacity:1;transform:none}}
@keyframes panelOut{from{opacity:1;transform:none}70%{opacity:.9}to{opacity:0;transform:scale(.25)}}
@keyframes secOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(6px)}}
@keyframes secIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#veil.open,#veil.open .panel,#veil.open .panel .sec,#veil.closing,#veil.closing .panel,#veil.closing .panel .sec{animation:none}}
/* The owner, 2026-11-22: switching between the map and the kanban page cross-fades with a slight zoom (View Transitions where the
   browser has them, a plain fade otherwise); the kanban page carries the same rules */
@view-transition{navigation:auto}
::view-transition-old(root){animation:pgOut .3s ease-in both}
::view-transition-new(root){animation:pgIn .4s cubic-bezier(.2,.8,.25,1) both}
@keyframes pgOut{to{opacity:0;transform:scale(.97)}}
@keyframes pgIn{from{opacity:0;transform:scale(1.03)}}
@keyframes pgFadeIn{from{opacity:0}}
@keyframes pgFadeOut{to{opacity:0}}
.pg-enter body{animation:pgFadeIn .35s ease-out both}
body.pg-leave{animation:pgFadeOut .25s ease-in both}
@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root),.pg-enter body,body.pg-leave{animation:none}}
/* The owner, 2026-11-22: switching project is a trip across Arrakis: the map shakes, blurs and burns into a sand storm, then the new
   base comes out of the dust */
#storm{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .45s ease;overflow:hidden;
  background:radial-gradient(ellipse at 50% 50%,rgba(222,182,120,.92),rgba(150,100,56,.95) 60%,rgba(96,56,26,.97))}
#storm::before,#storm::after{content:"";position:absolute;inset:-60%}
#storm::before{background:repeating-linear-gradient(-18deg,rgba(240,212,160,0) 0 14px,rgba(240,212,160,.55) 14px 17px,rgba(240,212,160,0) 17px 46px)}
#storm::after{background:repeating-linear-gradient(-14deg,rgba(170,118,62,0) 0 30px,rgba(170,118,62,.45) 30px 34px,rgba(170,118,62,0) 34px 90px)}
#storm.on{opacity:1}
#storm{transition:opacity .38s ease-in-out}
#storm.on::before{animation:gust1 .32s linear infinite}
#storm.on::after{animation:gust2 .5s linear infinite}
@keyframes gust1{to{transform:translateX(-48.37px)}}     /* one stripe period across: the loop has no seam */
@keyframes gust2{to{transform:translateX(-92.76px)}}
#stage.warp-out > svg{animation:warpOut .7s ease-in both}
#stage.warp-in > svg{animation:warpIn .95s cubic-bezier(.2,.8,.25,1) both}
@keyframes warpOut{0%{transform:none}15%{transform:translate(-6px,3px) rotate(-.3deg)}30%{transform:translate(7px,-4px) rotate(.4deg)}
  45%{transform:translate(-8px,2px) scale(1.02)}60%{transform:translate(6px,-3px) scale(1.04)}80%{transform:translate(-4px,2px) scale(1.07)}100%{transform:scale(1.1)}}
@keyframes warpIn{0%{transform:scale(.93)}20%{transform:scale(.95) translate(4px,-2px)}40%{transform:scale(.97) translate(-3px,2px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){#storm.on::before,#storm.on::after,#stage.warp-out > svg,#stage.warp-in > svg{animation:none}}
.harvtxt{font:600 8px var(--mono);letter-spacing:.06em;fill:#f0dcb4}
.hblink{animation:hblink 1s steps(1) infinite}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .7s ease-in-out infinite alternate}
@keyframes flame{from{transform:scaleY(.85) skewX(-4deg)}to{transform:scaleY(1.12) skewX(4deg)}}
@keyframes hblink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.hblink{animation:none}}
.zlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.zlist li{cursor:pointer;padding:4px 6px;border:1px solid transparent;font-size:14px}
.zlist li:hover{border-color:var(--edge-hi);background:rgba(255,255,255,.03)}
.harv{cursor:pointer}
.runs{margin:0;padding-left:16px}
.runs li{margin:2px 0}
.zdot{display:inline-block;width:9px;height:9px;margin-right:8px;vertical-align:middle}
.panel .prompt{white-space:pre-wrap;max-height:26vh;overflow:auto}

/* reliability notices; the sharp drag copy; a sleeping tab */
.notice{top:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:8px 14px;font:500 12px/1.4 var(--body);color:var(--bone);border-color:var(--alert);max-width:min(560px,90vw)}
.badge.stale{background:var(--alert);color:var(--night)}
#decohi{display:none}
.moving #ground.cached #decohi[href]{display:inline}
.asleep *{animation-play-state:paused!important}
/* the refresh wind: fine streaks of sand blowing across the screen */
#wind{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;overflow:hidden}
#wind::before,#wind::after{content:"";position:absolute;inset:-40%}
#wind::before{background:repeating-linear-gradient(-8deg,rgba(245,222,176,0) 0 60px,rgba(245,222,176,.45) 60px 61.5px,rgba(245,222,176,0) 61.5px 150px)}
#wind::after{background:repeating-linear-gradient(-5deg,rgba(200,150,90,0) 0 95px,rgba(200,150,90,.35) 95px 97px,rgba(200,150,90,0) 97px 240px)}
#wind.on{animation:windIn 3.6s ease-in-out both}
#wind.on::before{animation:blow1 .45s linear infinite}
#wind.on::after{animation:blow2 .7s linear infinite}
@keyframes windIn{0%{opacity:0}15%,75%{opacity:1}100%{opacity:0}}
@keyframes blow1{to{transform:translateX(151.47px)}}   /* one stripe period: a seamless loop */
@keyframes blow2{to{transform:translateX(240.92px)}}
@media (prefers-reduced-motion:reduce){#wind.on,#wind.on::before,#wind.on::after{animation:none}}
/* The owner, 2026-11-22: a smooth trip. While it plays the map is one GPU layer showing the cached picture of the ground (no vector
   repaint), the panels drop their backdrop blur, the map's own animations wait, and the blur stays moderate */
.warping #ground.cached #deco{display:none}
.warping #ground.cached #decoimg{display:inline}
.warping .hud{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--slab-hi)}
.warping #map *{animation-play-state:paused!important}

#storm::before,#storm::after,#wind::before,#wind::after{will-change:transform}
/* The owner, 2026-11-22: the slow ambient loops change a dozen times a second instead of sixty: each change repaints the map's upper
   layer, and at this pace the eye does not tell the difference */
.ring{animation-timing-function:steps(18)}
.smoke{animation-timing-function:steps(30)}
.bob,.halo,.beacon{animation-timing-function:steps(8)}
.flame{animation-timing-function:steps(5)}
.swirl{animation-timing-function:steps(24)}
.wing{animation-timing-function:steps(2)}
.status{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:10px 14px;display:grid;gap:6px;min-width:220px}
.st-row{display:flex;justify-content:space-between;align-items:center;gap:16px;font:500 12px/1.3 var(--mono);color:var(--bone)}
.st-k{color:var(--dust);letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.st-row b{font-weight:600;color:var(--bone)}
button.st-pr{all:unset;display:flex;justify-content:space-between;align-items:center;gap:16px;font:500 12px/1.3 var(--mono);color:var(--bone);cursor:pointer}
button.st-pr:disabled{cursor:default}
button.st-pr:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.st-v{display:inline-flex;align-items:center;gap:8px}
#st-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid;display:inline-block;box-shadow:0 0 8px currentColor}
#st-dot.blink{animation:hblink 1s steps(1) infinite}
@media (max-width:760px){.status{display:none}}
/* The owner, 2026-11-22: the signs open from a "?" button in the zoom panel, bottom right */
.zoom .legend{position:relative;bottom:auto;left:auto;padding:0;max-width:none}
.zoom .legend summary.btn{letter-spacing:0;font:600 13px/1 var(--mono);min-width:12px;text-align:center}
.zoom .legend[open] summary{margin-bottom:0;background:var(--sand);color:var(--night)}
.legend-pop{position:absolute!important;bottom:calc(100% + 16px);right:-8px;width:min(360px,calc(100vw - 28px));max-height:min(70vh,560px);overflow:auto;padding:12px 14px;animation:twIn2 .16s ease-out both}
@keyframes twIn2{from{opacity:0;transform:translateY(6px)}}
.legend-h{margin:0 0 10px;font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--sand)}
.legend-pop .x{position:absolute;top:6px;right:6px}
.legend-ver{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--edge);font:500 11px/1.3 var(--mono);color:var(--dust);letter-spacing:.04em}

<style>
/* Layout: a full-screen isometric board (SVG, pan and zoom), the HUD floating at the corners, panels over it. One dusk look, dark. */
:root{
 color-scheme:dark;
 --night:#140d08;--dusk1:#3a2414;--dusk2:#7a4a26;--dusk3:#b47c45;
 --sand:#d6ad78;--sand-hi:#ecd2a2;--sand-lo:#b88a58;--ridge:#f3dcb0;--hollow:#9c6c42;
 --rock:#7a5236;--rock-lo:#4a3020;--wood:#5a3a24;
 --bone:#efe3cc;--dust:#b89c74;--mute:#9a8467;--faint:#5e4c39;
 --ochre:#d08a3c;--ember:#e0662a;--alert:#e2553f;--amber:#e8b54a;--water:#7fb8cc;--ok:#a9c27f;
 --slab:rgba(28,19,12,.86);--slab-hi:rgba(44,31,20,.94);--edge:rgba(227,196,150,.16);--edge-hi:rgba(227,196,150,.38);
 --display:"Michroma","Segoe UI",sans-serif;--body:"Barlow","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--bone);font:15px/1.5 var(--body);overflow:hidden;touch-action:none}
#stage{position:fixed;inset:0;background:#6e4628}
/* The owner, 2026-11-22: the static ground and the living map are two stacked SVGs, each on its own GPU layer: the containers' rings,
   the smoke, the vehicles and the sandworm repaint only the upper layer, never the whole ground underneath */
#stage > svg{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform}
#mapGround{pointer-events:none}
#map{cursor:grab}
#map.drag{cursor:grabbing}
.hud{position:fixed;z-index:5;background:var(--slab);border:1px solid var(--edge);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));padding:12px 16px 12px}
.brand small{display:block;font:500 10px/1 var(--mono);letter-spacing:.4em;color:var(--sand);opacity:.85}
.brand h1{margin:8px 0 6px;font:400 19px/1 var(--display);letter-spacing:.36em;text-transform:uppercase}
.brand .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:500 11px/1 var(--mono);color:var(--dust)}
.brand .title-row{display:flex;align-items:center;gap:14px}
.brand .title-row .btn{padding:6px 8px;font-size:10px}
.strip{font:500 11px/1.35 var(--mono);color:var(--dust);padding:2px 0 0;max-width:260px}.strip b{color:var(--sand)}.strip i{color:var(--ok);font-style:normal}.strip.warn b{color:var(--amber)}
.pages{display:flex;gap:6px}.pages a{font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sand);text-decoration:none;padding:6px 8px;border:1px solid var(--edge-hi);background:rgba(20,13,8,.5)}.pages a:hover{color:var(--bone);border-color:var(--sand)}.pages a[aria-disabled]{opacity:.45;pointer-events:none}.pages a[aria-current]{color:var(--night);background:var(--sand);border-color:var(--sand)}
.brand .title-row select.btn{cursor:pointer;max-width:220px}
.brand .title-row select.btn option{background:#140d08;color:var(--sand)}
.badge{padding:5px 8px;border:1px solid var(--edge-hi);letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.badge.sample{color:var(--night);background:var(--amber);border-color:var(--amber)}
.badge.live{color:var(--ok);border-color:var(--ok)}
button{font:inherit;color:inherit}
.btn{all:unset;cursor:pointer;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:9px 11px;border:1px solid var(--edge-hi);color:var(--sand);background:rgba(20,13,8,.5);white-space:nowrap}
.btn:hover{color:var(--bone);border-color:var(--sand)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.on{color:var(--night);background:var(--sand);border-color:var(--sand)}
.tools{top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));padding:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:min(620px,calc(100vw - 28px))}
.tools input,.tools select{font:500 12px/1 var(--mono);color:var(--bone);background:rgba(20,13,8,.6);border:1px solid var(--edge-hi);padding:8px 10px;min-width:0}
.tools input{width:190px}
.tools input::placeholder{color:var(--mute)}
.summary{top:calc(118px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));padding:10px 12px;display:flex;flex-direction:column;gap:6px;max-width:250px}
.chip{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font:500 11.5px/1.25 var(--mono);color:var(--sand);padding:4px 2px}
.chip b{font-weight:500;color:var(--bone);min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.chip:hover{color:var(--bone)}
.chip.on{color:var(--amber)}
.dot{width:9px;height:9px;flex:none;border-radius:50%;background:var(--sand)}
.zoom{bottom:calc(14px + env(safe-area-inset-bottom,0px));right:calc(14px + env(safe-area-inset-right,0px));padding:8px;display:flex;gap:6px;align-items:center}
.zoom .pct{font:500 11px/1 var(--mono);color:var(--dust);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.legend{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:calc(14px + env(safe-area-inset-left,0px));padding:10px 14px;max-width:min(360px,calc(100vw - 200px))}
.legend summary{cursor:pointer;font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--sand);list-style:none}
.legend summary::-webkit-details-marker{display:none}
.legend[open] summary{margin-bottom:10px}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13px;color:var(--dust)}
.legend li{display:flex;gap:10px;align-items:center}
.legend svg{flex:none}
#tip{position:fixed;z-index:20;pointer-events:none;max-width:320px;padding:10px 12px;background:var(--slab-hi);border:1px solid var(--edge-hi);font-size:13px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#tip .n{font:500 12px/1 var(--mono);color:var(--amber)}
#tip .t{display:block;margin:6px 0;color:var(--bone)}
#tip .s{font:500 11px/1.4 var(--mono);color:var(--dust)}
/* panels */
.veil{position:fixed;inset:0;z-index:30;background:rgba(10,6,3,.62);display:flex;align-items:center;justify-content:center;padding:max(2vh,env(safe-area-inset-top,0px)) max(2vw,env(safe-area-inset-right,0px)) max(2vh,env(safe-area-inset-bottom,0px)) max(2vw,env(safe-area-inset-left,0px))}
.panel{position:relative;width:min(1280px,96vw);height:min(92vh,100%);background:linear-gradient(180deg,rgba(40,28,18,.97),rgba(24,16,10,.98));border:1px solid var(--edge-hi);display:flex;flex-direction:column;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.panel.small{width:min(560px,96vw);height:auto;max-height:92vh}
.panel header{padding:22px 26px 16px;border-bottom:1px solid var(--edge);display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:start}
.panel .big{font:400 30px/1 var(--display);color:var(--amber);letter-spacing:.06em}
.panel h2{margin:0 0 10px;font:600 21px/1.25 var(--body);color:var(--bone);text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--edge-hi);color:var(--sand)}
.tag.hot{color:var(--night);background:var(--ember);border-color:var(--ember)}
.tag.staged{color:var(--night);background:var(--amber);border-color:var(--amber)}
.x{all:unset;cursor:pointer;font:500 22px/1 var(--body);color:var(--night);background:var(--amber);border:1px solid var(--amber);width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex:none;box-sizing:border-box}
.x:hover{background:var(--bone);border-color:var(--bone)}.x:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.legend .x{position:absolute;top:6px;right:6px;width:26px;height:26px;font-size:17px}
.legend:not([open]) .x{display:none}
.body{flex:1;min-height:0;overflow:auto;padding:20px 26px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px}
.body h3{margin:0 0 10px;font:400 11px/1 var(--display);letter-spacing:.3em;text-transform:uppercase;color:var(--sand)}
.sec{margin-bottom:24px}
.md{font-size:14.5px;color:var(--bone);max-width:70ch}
.md p{margin:0 0 10px}.md ul{margin:0 0 10px;padding-left:18px}.md li{margin:3px 0}
.md code{font:12.5px var(--mono);background:rgba(227,196,150,.1);padding:1px 4px}
.md table{border-collapse:collapse;margin:6px 0 12px;font-size:13px;display:block;overflow-x:auto}
.md td,.md th{border:1px solid var(--edge);padding:5px 8px;text-align:left;vertical-align:top}
.md th{color:var(--sand);font-weight:500}
.crit{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.crit li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:14px}
.crit li.done{color:var(--mute)}
.crit .box{width:13px;height:13px;margin-top:4px;border:1px solid var(--sand)}
.crit li.done .box{background:var(--sand)}
.grid{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14px}
.grid dt{font:500 11px/1.9 var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.grid dd{margin:0;color:var(--bone);min-width:0;overflow-wrap:anywhere}
.fit{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--edge)}
.fit strong{display:block;font:600 15px/1.2 var(--body)}
.fit span{font-size:13px;color:var(--dust)}
.hist{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid var(--edge-hi);display:grid;gap:10px}
.hist li{position:relative;font-size:13.5px}
.hist li::before{content:"";position:absolute;left:-18px;top:6px;width:7px;height:7px;background:var(--sand);transform:rotate(45deg)}
.hist time{display:block;font:500 11px/1.3 var(--mono);color:var(--mute)}
.panel footer{border-top:1px solid var(--edge);padding:16px 26px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center}
.folder{font:500 12px/1.4 var(--mono);color:var(--dust)}
.folder b{color:var(--amber);font-weight:500}
.prompt{grid-column:1;font:14px/1.45 var(--body);color:var(--bone);background:rgba(10,6,3,.5);border:1px solid var(--edge);padding:10px 12px;user-select:all}
.copy{grid-row:1 / span 2;grid-column:2;align-self:stretch;display:flex;align-items:center}
.muted{color:var(--mute);font-size:13.5px}
a{color:var(--amber)}
/* board marks */
.blk,.wkr,.plaque{cursor:pointer}
.blk .lbl{font:500 10px var(--mono);fill:var(--bone)}
.blk:hover .cube,.blk:focus .cube{filter:brightness(1.25)}
.blk:focus{outline:none}
.blk.dim,.wkr.dim{opacity:.16}

<script>
"use strict";
let REPO = "";                                          // owner/name, from the state (project.repo)
const TW = 64, TH = 32;                                 // one tile: 64 x 32 px at zoom 1
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const iso = (x, y, z = 0) => [(x - y) * TW / 2, (x + y) * TH / 2 - z * TH];
const P = pts => pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(f >= 1 ? v + (255 - v) * (f - 1) : v * f))));
  return "#" + c.map(v => v.toString(16).padStart(2, "0")).join("");
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const C = {}; ["sand","sand-hi","sand-lo","ridge","hollow","rock","rock-lo","wood","bone","ochre","ember","alert","amber","water","ok","night","dust","mute","faint"].forEach(k => C[k] = css("--" + k));

// ------------------------------------------------------------------ primitives (SVG strings)
function prism(x, y, w, d, h, base, extra = "") {
  const t = shade(base, 1.14), l = shade(base, .8), r = shade(base, .62);
  const a = iso(x, y, h), b = iso(x + w, y, h), c = iso(x + w, y + d, h), e = iso(x, y + d, h);
  const b0 = iso(x + w, y), c0 = iso(x + w, y + d), e0 = iso(x, y + d);
  return `<g ${extra}><polygon points="${P([b0, c0, c, b])}" fill="${r}"/><polygon points="${P([e0, c0, c, e])}" fill="${l}"/><polygon points="${P([a, b, c, e])}" fill="${t}"/></g>`;
}
function cyl(x, y, r, h, base, z = 0) {
  const [cx, by] = iso(x, y, z), ty = by - h * TH, rx = r * TW * .7071, ry = r * TH * .7071;
  return `<path d="M${cx - rx} ${by}V${ty}A${rx} ${ry} 0 0 0 ${cx + rx} ${ty}V${by}A${rx} ${ry} 0 0 1 ${cx - rx} ${by}Z" fill="${shade(base, .72)}"/>` +
         `<path d="M${cx} ${by + ry}V${ty + ry}A${rx} ${ry} 0 0 0 ${cx + rx} ${ty}V${by}A${rx} ${ry} 0 0 1 ${cx} ${by + ry}Z" fill="${shade(base, .58)}"/>` +
         `<ellipse cx="${cx}" cy="${ty}" rx="${rx}" ry="${ry}" fill="${shade(base, 1.12)}"/>`;
}
function dome(x, y, r, h, base) {
  const [cx, by] = iso(x, y), rx = r * TW * .7071, ry = r * TH * .7071, hh = h * TH;
  return `<path d="M${cx - rx} ${by}A${rx} ${hh} 0 0 1 ${cx + rx} ${by}A${rx} ${ry} 0 0 1 ${cx - rx} ${by}Z" fill="${shade(base, .78)}"/>` +
         `<path d="M${cx} ${by - hh}A${rx} ${hh} 0 0 1 ${cx + rx} ${by}A${rx} ${ry} 0 0 1 ${cx} ${by + ry}Z" fill="${shade(base, .62)}"/>` +
         `<ellipse cx="${cx - rx * .35}" cy="${by - hh * .62}" rx="${rx * .28}" ry="${hh * .16}" fill="${shade(base, 1.25)}" opacity=".7"/>`;
}
function tent(x, y, w, d, h, base) {
  const ap = iso(x + w / 2, y + d / 2, h);
  return `<polygon points="${P([iso(x + w, y), iso(x + w, y + d), ap])}" fill="${shade(base, .62)}"/><polygon points="${P([iso(x, y + d), iso(x + w, y + d), ap])}" fill="${shade(base, .9)}"/>` +
         `<polygon points="${P([iso(x + w * .42, y + d), iso(x + w * .58, y + d), ap])}" fill="${shade(base, .35)}" opacity=".7"/>`;
}
function rock(x, y, s, h) {
  let out = prism(x - s / 2, y - s / 2, s, s * .9, h, C.rock);
  out += prism(x - s * .3, y - s * .35, s * .6, s * .55, h * 1.45, shade(C.rock, .92));
  return out;
}
function flyerSVG(scale = 1) {   // an original ornithopter, seen from the side and facing right: a long armoured fuselage with a glazed nose,
  // a tail boom, landing skids and two pairs of long dragonfly wings beating above it; its cargo hook hangs at (0, 14)
  const s = scale, f = v => (v * s).toFixed(1), body = "#b0906e", mid = "#8a6c52", line = "#3a2717";   // warm, sand-worn metal
  const wing = (x0, y0, x1, y1, w, cls, op, delay) => {          // a long leaf from its root to its tip, with a vein down the middle
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, nx = -(y1 - y0), ny = x1 - x0, k = w / Math.hypot(nx, ny);
    return `<g class="${cls}"${delay ? ` style="animation-delay:${delay}s"` : ""}><path d="M${f(x0)} ${f(y0)}Q${f(mx + nx * k)} ${f(my + ny * k)} ${f(x1)} ${f(y1)}Q${f(mx - nx * k * .6)} ${f(my - ny * k * .6)} ${f(x0)} ${f(y0)}Z" fill="${C.ridge}" fill-opacity="${op}" stroke="${C.bone}" stroke-opacity=".45" stroke-width=".7"/>` +
      `<path d="M${f(x0)} ${f(y0)}L${f(x1)} ${f(y1)}" stroke="${line}" stroke-opacity=".45" stroke-width=".6"/></g>`;
  };
  return `<g class="flyer-g"><ellipse cx="0" cy="${f(26)}" rx="${f(22)}" ry="${f(5)}" fill="#000" opacity=".18"/>` +
    wing(-6, -6, -34, -22, 5, "wing", .38, .08) + wing(6, -6, 34, -24, 5, "wing", .38, 0) +                 // the far pair, behind the body
    `<path d="M${f(-24)} ${f(-1)}L${f(-40)} ${f(-3)}L${f(-42)} ${f(-9)}L${f(-37)} ${f(-3)}L${f(-24)} ${f(2)}Z" fill="${mid}" stroke="${line}" stroke-width=".7"/>` +   // tail boom and fin
    `<path d="M${f(-26)} ${f(0)}Q${f(-26)} ${f(-7)} ${f(-16)} ${f(-7)}L${f(9)} ${f(-8)}Q${f(22)} ${f(-7)} ${f(24)} ${f(0)}Q${f(22)} ${f(6)} ${f(9)} ${f(6)}L${f(-16)} ${f(5)}Q${f(-26)} ${f(5)} ${f(-26)} ${f(0)}Z" fill="${body}" stroke="${line}" stroke-width=".8"/>` +
    `<path d="M${f(-16)} ${f(1)}L${f(8)} ${f(1)}M${f(-6)} ${f(-7)}L${f(-6)} ${f(5)}M${f(2)} ${f(-8)}L${f(2)} ${f(6)}" stroke="${line}" stroke-opacity=".5" stroke-width=".6"/>` +   // panel seams
    `<path d="M${f(9)} ${f(-7)}Q${f(21)} ${f(-7)} ${f(23)} ${f(0)}L${f(12)} ${f(1)}Z" fill="${C.water}" opacity=".85"/><path d="M${f(14)} ${f(-6.5)}L${f(16)} ${f(0.5)}M${f(19)} ${f(-5)}L${f(20)} ${f(0.5)}" stroke="${line}" stroke-opacity=".5" stroke-width=".6"/>` +   // the glazed nose
    `<rect x="${f(-10)}" y="${f(4)}" width="${f(12)}" height="${f(4)}" rx="${f(2)}" fill="${mid}" stroke="${line}" stroke-width=".6"/>` +   // the engine pod under the belly
    `<path d="M${f(-12)} ${f(5)}L${f(-14)} ${f(11)}M${f(8)} ${f(5)}L${f(10)} ${f(11)}M${f(-18)} ${f(11)}L${f(14)} ${f(11)}" stroke="${line}" stroke-width="${f(1.1)}" stroke-linecap="round"/>` +   // the skids
    `<path d="M0 ${f(8)}L0 ${f(14)}" stroke="${line}" stroke-width=".8"/>` +
    wing(-4, -7, -36, -16, 6, "wing", .68, .08) + wing(6, -7, 38, -18, 6, "wing", .68, 0) +              // the near pair, in front
    `<circle cx="${f(-4)}" cy="${f(-7)}" r="${f(1.6)}" fill="${line}"/><circle cx="${f(6)}" cy="${f(-7)}" r="${f(1.6)}" fill="${line}"/></g>`;
}
function haulerSVG() {            // an original desert hauler: an armoured cab on a short flatbed with six balloon wheels, for short hops
  const body = shade(C.rock, 1.18), dark = shade(C.rock, .55), mid = shade(C.rock, .82);
  return `<g><ellipse cx="0" cy="3" rx="34" ry="7" fill="#000" opacity=".2"/>` +
    `<circle class="dust" cx="-44" cy="-3" r="7" fill="${C.sand}" opacity=".3"/><circle class="dust" cx="-55" cy="-7" r="5" fill="${C.sand}" opacity=".18" style="animation-delay:.25s"/>` +
    `<rect x="-31" y="-12" width="62" height="7" rx="1.5" fill="${dark}"/>` +
    `<polygon points="-31,-17 6,-17 6,-12 -31,-12" fill="${mid}"/><polygon points="-31,-17 -28,-21 -26,-17" fill="${dark}"/>` +
    `<polygon points="8,-12 8,-28 18,-31 32,-20 32,-12" fill="${body}" stroke="${dark}" stroke-width=".8"/>` +
    `<polygon points="17,-28.5 28,-20 26,-18 16,-25" fill="#1a110b"/>` +
    `<line x1="11" y1="-25" x2="11" y2="-14" stroke="${dark}" stroke-width="1"/><line x1="14" y1="-27" x2="14" y2="-14" stroke="${dark}" stroke-width="1"/>` +
    `<rect x="9" y="-38" width="3" height="10" fill="${dark}"/><rect x="8" y="-39" width="5" height="2" fill="${dark}"/>` +
    [-23, -9, 23].map(x => `<circle cx="${x}" cy="-4" r="6.5" fill="#2a1a10"/><circle cx="${x}" cy="-4" r="2.4" fill="${mid}"/>`).join("") + `</g>`;
}
function crawlerSVG() {           // an original sand crawler: a long hull on tracks
  return `<g><ellipse cx="0" cy="8" rx="30" ry="9" fill="#000" opacity=".18"/>` +
    `<polygon points="-30,2 26,-10 34,-4 -22,8" fill="${shade(C.rock, .55)}"/>` +
    `<polygon points="-26,-10 22,-22 30,-12 -18,0" fill="${shade(C.rock, 1.05)}"/>` +
    `<polygon points="-26,-10 -18,0 -18,6 -26,-4" fill="${shade(C.rock, .7)}"/><polygon points="-18,0 30,-12 30,-6 -18,6" fill="${shade(C.rock, .8)}"/>` +
    `<rect x="8" y="-30" width="6" height="12" fill="${shade(C.rock, .6)}"/><circle cx="11" cy="-33" r="4" fill="${C.sand}" opacity=".35"/></g>`;
}

// ------------------------------------------------------------------ the building kit (round 2: detailed, lit at dusk)
function prismZ(x, y, w, d, h, base, z = 0) {          // a box standing at height z
  const t = shade(base, 1.14), l = shade(base, .8), r = shade(base, .62);
  const a = iso(x, y, z + h), b = iso(x + w, y, z + h), c = iso(x + w, y + d, z + h), e = iso(x, y + d, z + h);
  const b0 = iso(x + w, y, z), c0 = iso(x + w, y + d, z), e0 = iso(x, y + d, z);
  return `<polygon points="${P([b0, c0, c, b])}" fill="${r}"/><polygon points="${P([e0, c0, c, e])}" fill="${l}"/><polygon points="${P([a, b, c, e])}" fill="${t}"/>`;
}
const LIT = "#ffcb73";
function windowsOn(x, y, w, d, h, z, opt) {               // window rows on the two faces we see; some lit, some dark
  const rows = opt.rows || Math.max(1, Math.floor(h / .9)), lit = [], dark = [];
  const wh = Math.min(.42, h / (rows * 2.2)), ww = .26;
  for (let r = 0; r < rows; r++) {
    const z0 = z + h * (r + .35) / rows;
    for (let a = .45; a < w - .3; a += .7) { const q = P([iso(x + a, y + d, z0), iso(x + a + ww, y + d, z0), iso(x + a + ww, y + d, z0 + wh), iso(x + a, y + d, z0 + wh)]); (rnd() < (opt.lit ?? .55) ? lit : dark).push(q); }
    for (let a = .45; a < d - .3; a += .7) { const q = P([iso(x + w, y + a, z0), iso(x + w, y + a + ww, z0), iso(x + w, y + a + ww, z0 + wh), iso(x + w, y + a, z0 + wh)]); (rnd() < (opt.lit ?? .55) * .8 ? lit : dark).push(q); }
  }
  const d0 = dark.map(q => `<polygon points="${q}" fill="#24160d"/>`).join(""), l0 = lit.map(q => `<polygon points="${q}" fill="${LIT}"/>`).join("");
  return d0 + (lit.length ? `<g filter="url(#f-glow)" opacity=".8">${l0}</g>${l0}` : "");
}
function building(x, y, w, d, h, base, opt = {}) {
  const z = opt.z || 0;
  let s = "";
  s += prismZ(x, y, w, d, h, base, z);
  // parapet: a raised rim around the roof, darker inside
  const k = .14, H = z + h;
  s += `<polygon points="${P([iso(x + k, y + k, H), iso(x + w - k, y + k, H), iso(x + w - k, y + d - k, H), iso(x + k, y + d - k, H)])}" fill="${shade(base, .92)}"/>`;
  s += prismZ(x, y, w, k, .14, shade(base, 1.05), H) + prismZ(x, y, k, d, .14, shade(base, 1.05), H) + prismZ(x, y + d - k, w, k, .14, base, H) + prismZ(x + w - k, y, k, d, .14, base, H);
  if (opt.windows !== false) s += windowsOn(x, y, w, d, h, z, opt);
  if (opt.door) { const a = w / 2 - .3; s += `<polygon points="${P([iso(x + a, y + d, z), iso(x + a + .6, y + d, z), iso(x + a + .6, y + d, z + Math.min(.9, h * .7)), iso(x + a, y + d, z + Math.min(.9, h * .7))])}" fill="#1c110a"/><polygon points="${P([iso(x + a, y + d + .02, z), iso(x + a + .6, y + d + .02, z), iso(x + a + .6, y + d + .02, z + .12), iso(x + a, y + d + .02, z + .12)])}" fill="${LIT}" opacity=".6"/>`; }
  if (opt.vents) for (let i = 0; i < opt.vents; i++) s += prismZ(x + .4 + i * (w - .8) / Math.max(1, opt.vents), y + d * .35, .4, .4, .3, shade(base, .7), H + .14);
  if (opt.saw) for (let i = 0; i < opt.saw; i++) { const xa = x + i * w / opt.saw, xb = xa + w / opt.saw; s += `<polygon points="${P([iso(xa, y + .1, H), iso(xa, y + d - .1, H), iso(xb, y + d - .1, H + .7), iso(xb, y + .1, H + .7)])}" fill="${shade(base, .95)}"/><polygon points="${P([iso(xb, y + .1, H), iso(xb, y + d - .1, H), iso(xb, y + d - .1, H + .7), iso(xb, y + .1, H + .7)])}" fill="${LIT}" opacity=".75"/>`; }
  return s;
}
