# saani.toml: Saani's settings for one project. Put it at the project's root and commit it (docs/CONFIG.md explains every setting).
# Commands are lists; "{python}" is replaced by the Python that runs Saani.

[project]
repo = "acme/webshop"            # GitHub owner/name
owner = "your-github-login"      # assigned to an issue when its work starts (the "in progress" sign); "" to never assign

[branches]
integration = "dev"              # where work lands, one landing at a time
production = "main"              # what is released
prod_tag = "prod"                # the tag that marks what is live; a hotfix starts there

[worktrees]
# folder = "../webshop-wt"       # default: ../<repo name>-wt beside the main checkout

[issues]
types = { Task = "task", Feature = "feat", Bug = "bug" }   # GitHub issue Type -> branch prefix; an issue with no Type is refused
hotfix_default_type = "bug"      # a hotfix is never refused for a missing Type
# The labels Saani reads and writes (these are the defaults):
labels = { in_dev = "in-dev", in_main = "in-main", answer = "help wanted", act = "owner-action", idea = "idea" }

[status]
enabled = "auto"                 # GitHub's issue statuses: used when the repo has them; "off" = labels only
# The status of each step (these are the defaults; a renamed status is found by its category):
names = { backlog = "Backlog", todo = "Todo", started = "In progress", review = "In review", done = "Done" }

[pipeline]
# When an issue's signals disagree on its place, the first of these wins (the default; ["labels"] = the labels first, as before):
trust = ["status", "git", "labels"]
# An order of its own for one place (backlog, todo, you, works, proving, yard, depot, tower, pad, archive, outpost, citadel):
# [pipeline.place]
# depot = ["labels", "git", "status"]

[commits]
trailers = ["Why", "Undo"]       # each commit on a worker's branch or the integration branch carries these lines

[tests]
landing = ["{python}", "-m", "pytest", "-q"]        # before every landing: the tests a change can affect (here: all of them)
full = ["{python}", "-m", "pytest", "-q"]           # before a release, and the PC's CI
check = []                                          # quick checks before the full run on the PC (lint, repository rules)
timing_reports = []                                 # e.g. ["build/tests.json"]: copied into new worktrees for test estimates

[land]
generated = []                   # files rebuilt at landing, never by hand; a conflict there takes the integration copy
rebuild = []                     # commands that rebuild them, in order, e.g. [["{python}", "-I", "scripts/build_docs.py"]]
frozen = {}                      # path = "mark": once the mark is in the file on the integration branch, no branch may change it
lock_stale_hours = 2
push_attempts = 3

[deploy]
# {key} = the deploy key's path, {sha} = the commit checked (the server deploys exactly it). On the server, force a gate script that allows
# only these exact commands (docs/SAANI.md, "Deploy"); never a bare command="deploy-prod": it would make every check deploy for real.
command = []                     # e.g. ["ssh", "-i", "{key}", "deploy@shop.example", "deploy-prod", "{sha}"]; empty: saani deploy refuses
dry_run = []                     # e.g. ["ssh", "-i", "~/.ssh/webshop_check", "deploy@shop.example", "deploy-prod", "--dry-run", "{sha}"]; empty: skipped
checks = []                      # command lists run first, each must exit 0, e.g. [["ssh", "-i", "~/.ssh/webshop_check", "deploy@shop.example", "check-disk"]]
                                 # (a second key, allowed only the checks and the dry run, so a mistake there cannot deploy)
log_ok = ""                      # a regex the deploy's output must match to count as a success
key = ""                         # the PATH of the deploy key, never its content, e.g. "~/.ssh/webshop_deploy"
timeout_minutes = 30
paths = []                       # path prefixes the project deploys (the map: an issue touching none is "To close")

[release]
version_file = ""                # the file holding the version (`version = "1.2.0"`): when a merged dev -> main pull request changes it, `saani merge` creates the GitHub release v<version>; empty: no release

[board]
folders = { work = "C:/work/webshop", deploy = "C:/work/webshop-main", auto = "C:/work/webshop-auto" }
session_match = "webshop"        # Claude Code sessions whose project folder name contains this are listed
port = 8771

[auto]
parallel = 0                      # issues an auto run keeps in flight: 0 = sized from the cores and free RAM, (at most 2), else n from 1 to 10 (a warning above 5)
ci_attempts = 3                   # an auto run: the most `saani ci pr` rounds (fix, land, again) before it leaves the pull request open
# Read-only clones of upstream projects, relative to the main checkout: an auto run fetches their tags and reads their code at a tag
# (git -C ../upstream-lib show v2.0:src/lib.py), never checks them out. Each is outside the project, a git clone with an origin remote;
# one missing on this machine is a warning when a run starts.
# reference_clones = ["../upstream-lib"]

[ci]
workflow = "ci.yml"              # the GitHub Actions workflow `saani ci pr` starts (workflow_dispatch)
free_minutes = 2000              # GitHub Free, private repositories, per month, the whole account
reserve_minutes = 50
pace_slack = 0.15
status_context = "saani/ci"      # the commit status set on the pull request's head
relabel = []                     # a command that swaps in-dev for in-main after a merge, given the PR number
jobs = { pr-ci = { minutes = 20, heavy = true, what = "the CI of the dev -> main pull request" } }

[hints]
hotfix_after_merge = "After the merge: deploy from main, then merge main back into dev."
